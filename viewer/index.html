<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>3D plattegrond</title>
<style>
  @font-face { font-family: 'Area Normal'; src: url('../assets/fonts/AreaNormal-Regular.otf') format('opentype'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Area Normal'; src: url('../assets/fonts/AreaNormal-Semibold.otf') format('opentype'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Area Normal'; src: url('../assets/fonts/AreaNormal-Extrabold.otf') format('opentype'); font-weight: 800; font-display: swap; }
  @font-face { font-family: 'Area Normal'; src: url('../assets/fonts/AreaNormal-Extrablack.otf') format('opentype'); font-weight: 900; font-display: swap; }
  html, body { margin: 0; height: 100%; background: #eceff0; font-family: 'Area Normal', system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #c { width: 100%; height: 100%; display: block; }
  #badge {
    position: fixed; top: 16px; left: 16px; z-index: 70;
    display: flex; align-items: center; gap: 10px;
    background: rgba(20,20,20,.88); color: #fff; border-radius: 999px;
    padding: 8px 18px 8px 10px; font-weight: 800; font-size: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.25);
  }
  #badge img { height: 26px; max-width: 90px; object-fit: contain; }
  #status {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    background: #eceff0; color: #333; font-size: 15px; z-index: 80; transition: opacity .4s;
  }
  #status.hidden { opacity: 0; pointer-events: none; }
  #status .err { color: #b00020; font-weight: 700; max-width: 640px; word-break: break-word; }
  #scenes {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 70;
    display: flex; gap: 4px; background: rgba(20,20,20,.88); border-radius: 999px; padding: 4px;
  }
  #scenes button {
    border: 0; background: transparent; color: #fff; font-weight: 800; font-size: 13px;
    padding: 8px 18px; border-radius: 999px; cursor: pointer;
  }
  #scenes button.active { background: #fff; color: #111; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="status">3D plattegrond laden…</div>
<div id="badge" style="display:none"></div>
<div id="scenes" style="display:none"></div>
<script type="module">
const statusEl = document.getElementById('status');
function fail(msg) {
  statusEl.innerHTML = '<div class="err"></div>';
  statusEl.querySelector('.err').textContent = msg;
  statusEl.classList.remove('hidden');
}
window.addEventListener('error', (e) => fail('Er ging iets mis: ' + (e.message || 'onbekende fout')));
window.addEventListener('unhandledrejection', (e) => fail('Er ging iets mis: ' + (e.reason && e.reason.message || e.reason || 'onbekende fout')));

// Alle paden relatief aan de projectbasis, zodat het ook onder een subpad
// werkt (bijv. github.io/nbc3dmodel/viewer/), met of zonder afsluitende slash.
const BASE = (() => {
  const u = new URL(location.href);
  u.hash = ''; u.search = '';
  u.pathname = u.pathname.replace(/\/viewer(\/(index\.html)?)?$/, '') + '/';
  return u;
})();
const url = (p) => new URL(p, BASE).href;

// Cache-busting op de eigen modules: browsers cachen ES-modules los van de
// pagina, waardoor een hard refresh soms een verouderde branding.js liet
// draaien. Bump APP_VERSION bij elke wijziging aan src/*.
const APP_VERSION = 'v22';
let Application, applyBranding, DECOR_PRESETS, initTooltips, applyQuality;
try {
  ({ Application } = await import(url('vendor/spline/runtime.js')));
  ({ applyBranding, DECOR_PRESETS } = await import(url('src/branding.js') + '?' + APP_VERSION));
  ({ initTooltips } = await import(url('src/tooltips.js') + '?' + APP_VERSION));
  ({ applyQuality } = await import(url('src/quality.js') + '?' + APP_VERSION));
} catch (e) {
  fail('Kon de 3D-runtime niet laden (' + (e.message || e) + '). Controleer of vendor/, src/ en assets/ mee zijn gepubliceerd.');
  throw e;
}

const SCENES = {
  congres: { url: url('assets/spline/congres/scene.splinecode'), label: 'Congres' },
  feest:   { url: url('assets/spline/feest/scene.splinecode'),   label: 'Bedrijfsfeest' },
  sitdown: { url: url('assets/spline/sitdown/scene.splinecode'), label: 'Sit-down dinner' },
  lounge:  { url: url('assets/spline/lounge/scene.splinecode'),  label: '1: Lounge Area' },
};
// lounge alleen tonen als de config er expliciet om vraagt
const DEFAULT_SCENE_KEYS = ['congres', 'feest', 'sitdown'];

const badgeEl = document.getElementById('badge');
const scenesEl = document.getElementById('scenes');
const stage = document.getElementById('stage');

/** Config laden: #preview (sessionStorage, voor de beheeromgeving),
 *  ?e=TOKEN → configs/TOKEN.json, of #c=<base64url json>. */
async function loadConfig() {
  if (location.hash === '#preview') {
    try {
      const raw = sessionStorage.getItem('nbc3d-preview');
      if (raw) return JSON.parse(raw);
    } catch (e) { /* val terug op lege config */ }
    return {};
  }
  const params = new URLSearchParams(location.search);
  const token = params.get('e');
  if (token) {
    if (!/^[A-Za-z0-9_-]{4,64}$/.test(token)) throw new Error('Ongeldige link.');
    const res = await fetch(url(`configs/${token}.json`), { cache: 'no-store' });
    if (!res.ok) throw new Error(
      'Deze 3D plattegrond is nog niet beschikbaar. Is het event net gepubliceerd? ' +
      'De server heeft daarna ongeveer een minuut nodig — probeer het over een minuut nog eens. ' +
      `(Config "configs/${token}.json" niet gevonden.)`);
    return res.json();
  }
  const hash = new URLSearchParams(location.hash.slice(1));
  const packedZ = hash.get('z');   // gecomprimeerde link (deflate)
  const packedC = hash.get('c');   // oude ongecomprimeerde link
  if (packedZ || packedC) {
    const TRUNCATED = 'Deze link is onvolledig — hij is waarschijnlijk afgekapt bij het ' +
      'kopiëren, plakken of delen (lange links worden door sommige apps en de adresbalk ingekort). ' +
      'Open de link door erop te klikken, maak in de beheeromgeving een nieuwe deel-link, ' +
      'of gebruik de vaste link (?e=TOKEN) met het config-bestand op de server.';
    try {
      const packed = packedZ || packedC;
      const b64 = packed.replace(/-/g, '+').replace(/_/g, '/');
      const bytes = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
      let json;
      if (packedZ) {
        const ds = new DecompressionStream('deflate-raw');
        const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
        json = new TextDecoder().decode(buf);
      } else {
        json = new TextDecoder().decode(bytes);
      }
      return JSON.parse(json);
    } catch (e) {
      throw new Error(TRUNCATED);
    }
  }
  return {}; // ongebrand model
}

let app = null;
let tooltips = null;
let quality = null;
let config = {};
let loadId = 0;

// Debug-handle (console/tests): window.__nbc3d.app, .quality
// Kwaliteitsinstellingen zijn te overrulen met window.NBC3D_QUALITY = {...}
// (zie src/quality.js, QUALITY_DEFAULTS) vóórdat de pagina laadt.
window.__nbc3d = { get app() { return app; }, get quality() { return quality; }, get config() { return config; } };

async function showScene(key) {
  const id = ++loadId;
  [...scenesEl.children].forEach((b) => b.classList.toggle('active', b.dataset.key === key));
  statusEl.textContent = '3D plattegrond laden…';
  statusEl.classList.remove('hidden');
  if (tooltips) { tooltips.dispose(); tooltips = null; }
  if (quality) { try { quality.dispose(); } catch (e) {} quality = null; }
  if (app) { try { app.dispose(); } catch (e) {} app = null; }
  // verse canvas per scène (dispose laat soms context-resten achter)
  const old = document.getElementById('c');
  const canvas = old.cloneNode(false);
  old.replaceWith(canvas);

  app = new Application(canvas);
  await app.load(SCENES[key].url);
  if (id !== loadId) return; // inmiddels een andere scène gekozen
  // scherp beeld tijdens beweging + pixel ratio-beleid (zie src/quality.js)
  try {
    quality = applyQuality(app, window.NBC3D_QUALITY || {});
  } catch (e) {
    console.warn('Kwaliteitsinstellingen konden niet worden toegepast:', e);
  }
  try {
    // decor-presets (meegeleverde wandbeelden) omzetten naar een afbeelding
    const cfg = JSON.parse(JSON.stringify(config));
    const preset = cfg.eventhall && typeof cfg.eventhall.type === 'string' && cfg.eventhall.type.startsWith('preset:')
      ? cfg.eventhall.type.slice(7) : null;
    if (preset) {
      if (DECOR_PRESETS[preset]) {
        cfg.eventhall.type = 'custom';
        cfg.eventhall.image = url('assets/decors/' + DECOR_PRESETS[preset]);
      }
    }
    await applyBranding(app, cfg);
  } catch (e) {
    console.warn('Branding kon niet volledig worden toegepast:', e);
  }
  if (config.tooltips !== false) {
    tooltips = initTooltips(app, stage, { accent: (config.colors && config.colors.primary) || '#E4032E', hidden: config.hiddenTooltips || [] });
  }
  statusEl.classList.add('hidden');
}

function initUI() {
  if (config.eventName || config.logo) {
    badgeEl.style.display = 'flex';
    badgeEl.innerHTML = '';
    if (config.logo) { const img = new Image(); img.src = config.logo; badgeEl.appendChild(img); }
    const span = document.createElement('span');
    span.textContent = 'NBC' + (config.eventName ? ' × ' + config.eventName : '');
    badgeEl.appendChild(span);
  }
  const keys = (config.scenes && config.scenes.length ? config.scenes : DEFAULT_SCENE_KEYS)
    .filter((k) => SCENES[k]);
  if (keys.length > 1) {
    scenesEl.style.display = 'flex';
    for (const k of keys) {
      const b = document.createElement('button');
      b.textContent = SCENES[k].label; b.dataset.key = k;
      b.addEventListener('click', () => { showScene(k).catch((e) => fail(e.message || String(e))); });
      scenesEl.appendChild(b);
    }
  }
  return keys[0] || 'congres';
}

try {
  config = await loadConfig();
  const first = initUI();
  await showScene(config.scene && SCENES[config.scene] ? config.scene : first);
} catch (e) {
  console.error(e);
  fail(e.message || 'Er ging iets mis bij het laden.');
}
</script>
</body>
</html>
